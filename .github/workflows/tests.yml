name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the layout against the official template's metrics
        run: python tests/check_layout.py

      - name: Check the language arrangements and reference styles
        run: python tests/check_variants.py

      - name: Archive the built PDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thesis
          path: build/thesis.pdf
          retention-days: 5
