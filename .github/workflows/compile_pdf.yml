name: Compile template PDF

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        typst-version: ["0.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Setup typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: ${{ matrix.typst-version }}

      - name: Point the template's package imports at src/
        # template/ imports the library through @preview, because that is what a project
        # created with `typst init` gets. The checkout is compiled against src/ instead, so
        # that the package need not be published first.
        run: |
          find template -name '*.typ' -print0 | xargs -0 sed -i \
            's|@preview/definitely-not-tuw-thesis:[0-9]*\.[0-9]*\.[0-9]*|/src/lib.typ|'

      - name: Compile PDF
        run: typst compile template/thesis.typ --root . --font-path template/fonts

      - name: Copy File
        run: |
          mkdir out
          cp ./template/thesis.pdf ./out/thesis.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
